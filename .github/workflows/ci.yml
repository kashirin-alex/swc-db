name: SWC-DB

on:
  push:
    branches: [ master, CI-test ]
  pull_request:
    branches: [ master, CI-test ]
    # paths:
    #  - 'src/*'
  # schedule:
  #  - cron: '26 4 * * 6'


jobs:

  # pull_request events have no github.event.head_commit; inspect the PR head
  # (or push tip) commit message so [TEST COMMIT] works for both event types.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 1

    - name: Check for [TEST COMMIT]
      id: check
      run: |
        msg=$(git log -1 --pretty=%B)
        if printf '%s\n' "$msg" | grep -Fq '[TEST COMMIT]'; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "Gate open — head commit contains [TEST COMMIT]"
        else
          echo "run=false" >> "$GITHUB_OUTPUT"
          echo "Gate closed — include [TEST COMMIT] in the head commit message to run CI"
        fi


  main:
    needs: gate
    if: needs.gate.outputs.run == 'true'

    strategy:
      fail-fast: false
      matrix:
        runs-on:      ['ubuntu-24.04']
        compiler:     [g++-12, g++-13, g++-14, clang++-16, clang++-17, clang++-18]
        build_type:   ['Release']
        O_LEVEL:      ['0', '1', '2', '3', '4', '5', '6']
        IMPL_SOURCE:  ['OFF', 'ON']
        THRIFT:       ['0.20.0']
        WITHOUT_THRIFT_C: ['OFF']
        TEST:         [1]
        exclude:
          - compiler: clang++-16
            O_LEVEL:  5
          - compiler: clang++-16
            O_LEVEL:  6
          - compiler: clang++-17
            O_LEVEL:  5
          - compiler: clang++-17
            O_LEVEL:  6
          - compiler: clang++-18
            O_LEVEL:  5
          - compiler: clang++-18
            O_LEVEL:  6
        # Sparse extras: do not multiply the full compiler/O_LEVEL grid.
        include:
          # Integration (TEST=2) on the same O_LEVEL/IMPL pairs that run unit tests
          - runs-on: ubuntu-24.04
            compiler: g++-13
            build_type: Release
            O_LEVEL: '3'
            IMPL_SOURCE: 'OFF'
            THRIFT: '0.20.0'
            WITHOUT_THRIFT_C: 'OFF'
            TEST: 2
          - runs-on: ubuntu-24.04
            compiler: g++-13
            build_type: Release
            O_LEVEL: '6'
            IMPL_SOURCE: 'ON'
            THRIFT: '0.20.0'
            WITHOUT_THRIFT_C: 'OFF'
            TEST: 2
          # Compile/validate thriftgen-0.23.0 (not covered by default THRIFT matrix).
          # Skip C-GLib: gen-c_glib for 0.23.0 trips -Werror=unused-variable (Layer B).
          - runs-on: ubuntu-24.04
            compiler: g++-13
            build_type: Release
            O_LEVEL: '3'
            IMPL_SOURCE: 'OFF'
            THRIFT: '0.23.0'
            WITHOUT_THRIFT_C: 'ON'
            TEST: 1

    runs-on: ${{ matrix.runs-on }}

    name: ${{ matrix.runs-on }} ${{ matrix.compiler }} O=${{ matrix.O_LEVEL }} IMPL=${{ matrix.IMPL_SOURCE }} THRIFT=${{ matrix.THRIFT }} TEST=${{ matrix.TEST }} ${{ matrix.build_type }}

    env:
      CXX: ${{ matrix.compiler }}
      CXXFLAGS: ''
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Config localhost SSH
      # sudo apt update; sudo apt -y install openssh-server
      run: |
        ssh-keygen -t rsa -b 4096 -N '' -f ~/.ssh/id_rsa
        cat ~/.ssh/id_rsa.pub | tee -a ~/.ssh/authorized_keys
        ssh-keyscan -t rsa localhost,ip6-localhost,localhost.localdomain,::1,::,127.0.0.1 >> ~/.ssh/known_hosts;
        chmod 600 ~/.ssh/authorized_keys
        chmod 700 ~/.ssh
        sudo chmod -c 0755 ~/
        ls -la ~/.ssh
        ssh localhost "echo 'SSH connection to localhost is OK user='$(whoami)"

    - name: Install Dependencies
      run: |
        if [[ ${{ matrix.runs-on }} =~ ^ubuntu-* ]]; then
          sudo apt-get update -y
          # sudo apt-get upgrade -y
          # clang++-N is the compiler binary; apt package is clang-N
          compiler_pkg='${{ matrix.compiler }}'
          compiler_pkg="${compiler_pkg/clang++/clang}"
          # CORE-PREREQUISITES (g++-14 ensures libstdc++ headers for Clang on Noble)
          sudo apt-get install -y \
            "$compiler_pkg" \
            g++-14 \
            libgoogle-perftools-dev \
            libre2-dev \
            zlib1g-dev \
            libsnappy-dev \
            libzstd-dev \
            libssl-dev \
            libreadline-dev \
            libcephfs-dev
          #
          # THRIFT-PREREQUISITES
          sudo apt-get install -y \
            libboost-math-dev \
            libevent-dev \
            libthrift-dev
          #
          # THRIFT-C_GLIB-PREREQUISITES
          # libglib2.0-dev / libffi-dev / libpcre2-dev are not pulled transitively
          # by libthrift-c-glib-dev on Ubuntu 24.04; static O_LEVEL needs the .a
          # files (Noble GLib uses PCRE2, not PCRE1).
          sudo apt-get install -y \
            libthrift-c-glib-dev \
            libglib2.0-dev \
            libffi-dev \
            libpcre2-dev \
            libpam-dev
          #
        fi

        git clone --branch asio-1-30-2 https://github.com/chriskohlhoff/asio.git

        # SWCDB_CLUSTER-PREREQUISITES
        # Prefer pip fabric (distro python3-fabric/paramiko can break swcdb_cluster).
        # --break-system-packages is required on Ubuntu 24.04+ (PEP 668).
        sudo apt-get install -y \
          python3-pip
        sudo python3 -m pip install --break-system-packages fabric
        #

        cmake -E make_directory ${{github.workspace}}/build

    - name: Configure
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: |
        cmake $GITHUB_WORKSPACE \
            -DO_LEVEL=${{ matrix.O_LEVEL }} \
            -DSWC_IMPL_SOURCE=${{ matrix.IMPL_SOURCE }} \
            -DSWC_LANGUAGES=NONE \
            -DTHRIFT_VERSION=${{ matrix.THRIFT }} \
            -DWITHOUT_THRIFT_C=${{ matrix.WITHOUT_THRIFT_C }} \
            -DASIO_INCLUDE_PATH=${{github.workspace}}/asio/asio/include \
            -DGLIB_INCLUDE_PATH="$(pkg-config --cflags glib-2.0 | tr ' ' ';' | sed 's/-I//g' )" \
            -DCMAKE_SKIP_RPATH=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/swcdb \
            -DSWC_DOCUMENTATION=OFF \
            -DSWC_INSTALL_DEP_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DSWC_SKIP_TEST_FS_CEPH=ON
        # -DSWC_MALLOC_NOT_INSISTENT=OFF


    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . -j$((`grep -c processor < /proc/cpuinfo || echo 1`)) --config ${{ matrix.build_type }}


    - name: Install
      working-directory: ${{github.workspace}}/build
      run: |
        cmake --install . --config ${{ matrix.build_type }}
        sudo mkdir -p /var/opt/swcdb
        sudo chmod -R 777 /var/opt/swcdb
        sudo chmod -R 777 /opt/swcdb


    - name: Test - libswcdb_core
      if: ${{ (matrix.TEST == '1' || matrix.TEST == '2') &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      working-directory: ${{github.workspace}}/build/tests/libswcdb_core/
      shell: bash
      run: sudo ctest --output-on-failure -C ${{ matrix.build_type }}


    - name: Test - libswcdb
      if: ${{ (matrix.TEST == '1' || matrix.TEST == '2') &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      working-directory: ${{github.workspace}}/build/tests/libswcdb/
      shell: bash
      run: sudo ctest --output-on-failure -C ${{ matrix.build_type }}


    # do as separate tasks
    #- name: Test - integration
    #  if: ${{ matrix.TEST == '2' &&
    #          ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
    #           (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
    #  working-directory: ${{github.workspace}}/build/tests/integration/
    #  shell: bash
    #  run: ctest --output-on-failure -C ${{ matrix.build_type }}


    - name: Test - integration - swcdb_cluster
      if: ${{ matrix.TEST == '2' &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      shell: bash
      run: |
        /opt/swcdb/sbin/swcdb_cluster deploy
        /opt/swcdb/sbin/swcdb_cluster start
        /opt/swcdb/sbin/swcdb_cluster stop

    - name: Test - integration - comm
      if: ${{ matrix.TEST == '2' &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      working-directory: ${{github.workspace}}/build/tests/integration/comm/
      shell: bash
      run: ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Test - integration - fs
      if: ${{ matrix.TEST == '2' &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      working-directory: ${{github.workspace}}/build/tests/integration/fs/
      shell: bash
      run: ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Test - integration - manager
      if: ${{ matrix.TEST == '2' &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      working-directory: ${{github.workspace}}/build/tests/integration/manager/
      shell: bash
      run: ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Test - integration - ranger
      if: ${{ matrix.TEST == '2' &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      working-directory: ${{github.workspace}}/build/tests/integration/ranger/
      shell: bash
      run: ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Test - integration - client
      if: ${{ matrix.TEST == '2' &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      working-directory: ${{github.workspace}}/build/tests/integration/client/
      shell: bash
      run: ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Test - integration - utils
      if: ${{ matrix.TEST == '2' &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      working-directory: ${{github.workspace}}/build/tests/integration/utils/
      shell: bash
      run: ctest --output-on-failure -C ${{ matrix.build_type }}

    - name: Test - integration - thrift
      if: ${{ matrix.TEST == '2' &&
              ((matrix.O_LEVEL == '3' && matrix.IMPL_SOURCE == 'OFF') ||
               (matrix.O_LEVEL == '6' && matrix.IMPL_SOURCE == 'ON'))}}
      working-directory: ${{github.workspace}}/build/tests/integration/thrift/
      shell: bash
      run: ctest --output-on-failure -C ${{ matrix.build_type }}
