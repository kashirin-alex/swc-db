# The original `rundocs/jekyll-rtd-theme` repository was removed from GitHub.
# `StarHPC/jekyll-rtd-theme` is a maintained fork keeping the same gem name,
# layouts and configuration API (forked from rundocs at v2.0.10).
remote_theme: StarHPC/jekyll-rtd-theme@2.0.13

rougify: gruvbox
fluid: true

# Site is served at https://swcdb.org/ via `docs/CNAME`, so baseurl is empty.
# When publishing without the CNAME (i.e. from https://kashirin-alex.github.io/swc-db/),
# set baseurl to "/swc-db".
url: "https://swcdb.org"
baseurl: ""
repository: "kashirin-alex/swc-db"

encoding: utf-8
breadcrumbs: true

logo: logo-big.svg
favicon: favicon.svg

author: Alex Kashirin &lt;kashirin.alex@gmail.com&gt; <br/> SWC-DB© License details at &lt;https://github.com/kashirin-alex/swc-db/#license&gt;
copyright:
  since: 2019
  revision: false # is show the revision

addons:
  - github:
      - homepage
      - issues



readme_index:
  with_frontmatter: true

plugins:
  - jekyll-default-layout
  - jekyll-readme-index
  - jekyll-github-metadata
  - jekyll-titles-from-headings
#  - jemoji
#  - jekyll-avatar
#  - jekyll-mentions
  - jekyll-sitemap
  - jekyll-remote-theme
